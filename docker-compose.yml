# The whole system (IA + backend + frontend). Expects the other two repos next to this one:
#   ../pqrsd-router-ai   ../pqrsd-router-backend
# Usage:  docker compose up --build     → http://localhost:3000
# Demo staff keys (local demo only, override them with env vars): shared «demo-funcionario-2026», «ana-demo-2026» (Ana Pérez), «luis-demo-2026» (Luis Ruiz).
# Verified: `docker compose up --build` + `npm run e2e:fullstack` (12/12).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pqrsd
      POSTGRES_PASSWORD: pqrsd
      POSTGRES_DB: pqrsd
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pqrsd"]
      interval: 5s
      retries: 10
  ai:
    build: ../pqrsd-router-ai
    depends_on:
      db: { condition: service_healthy }
    environment:
      MODELS_DIR: /data/models
      FEEDBACK_FILE: /data/feedback/feedback.jsonl
      DATABASE_URL: postgresql://pqrsd:pqrsd@db:5432/pqrsd
    volumes:
      - ai-models:/data/models
      - ai-feedback:/data/feedback
  backend:
    build: ../pqrsd-router-backend
    depends_on:
      db: { condition: service_healthy }
      ai: { condition: service_started }
    environment:
      PORT: 3001
      DATA_DIR: /data
      DATABASE_URL: postgres://pqrsd:pqrsd@db:5432/pqrsd
      AI_URL: http://ai:8000
      STAFF_API_KEY: ${STAFF_API_KEY:?define STAFF_API_KEY}
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - backend-data:/data
    ports:
      - "3001:3001"
  frontend:
    build:
      context: .
      args:
        # inlined in the browser bundle: the PUBLIC address of the backend
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on: [backend]
    environment:
      # used only by the Next.js server (SSR / ISR): the address of the backend INSIDE the compose network
      API_URL_INTERNAL: http://backend:3001/api/v1
    ports:
      - "3000:3000"
volumes:
  db-data:
  ai-models:
  ai-feedback:
  backend-data:
